name: Check DB migrations

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-db-migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration files
        id: detect
        run: |
          git fetch origin ${{ github.base_ref }}

          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "$FILES"

          if echo "$FILES" | grep -Ei 'migrations|migration|\.sql$|DbMigrations|EFMigrations'; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate PR description
        if: steps.detect.outputs.has_migrations == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -Eiq 'https://.*confluence|not applicable|documentation not required'; then
            echo "Documentation section completed"
          else
            echo "Migration detected but documentation section is incomplete"
            echo "Please add a Confluence link or mark documentation as Not applicable with a reason."
            exit 1
          fi